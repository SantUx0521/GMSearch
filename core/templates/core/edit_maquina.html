{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Máquina - {{ gimnasio.nombre_gym }}</title>
    <link rel="stylesheet" href="{% static 'core/css/edit_gym_profile.css' %}">
</head>
<body>
    <div class="main">
        <div class="center">
            <div class="header">
                <h1>Editar Máquina</h1>
                <h2>{{ gimnasio.nombre_gym }}</h2>
                <div class="navigation-buttons">
                    <a href="{% url 'edit_inventory' gimnasio.codigo_gym %}" class="btn-volver">← Volver al inventario</a>
                </div>
            </div>

            <form method="POST" class="edit-form">
                {% csrf_token %}
                
                <div class="form-section">
                    <h3>Información de la Máquina</h3>
                    
                    <div class="form-group">
                        <label for="nombre">Nombre de la máquina:</label>
                        <input type="text" id="nombre" name="nombre" value="{{ maquina.nombre }}" required>
                    </div>

                    <div class="form-group">
                        <label for="descripcion">Descripción:</label>
                        <textarea id="descripcion" name="descripcion" rows="4" required>{{ maquina.descripcion }}</textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save">Guardar cambios</button>
                    <a href="{% url 'edit_inventory' gimnasio.codigo_gym %}" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
