{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datos adicionales gym</title>
  <link rel="stylesheet" href="{% static 'core/css/post_register.css' %}">
</head>
<body>
  <div class="main">
        <div class="center">
        <h1>Registra detalles adicionales de tu gimnasio</h1>
        <h2>{{ gimnasio.nombre_gym }}</h2>

        <form method="POST">
            {% csrf_token %}
            
            <div class="User">
                <input type="text" name="nombre_maquina" placeholder=" ">
                <label>Nombre de la máquina</label>
                <span></span>
            </div>

            <div class="User">
                <input type="number" name="cantidad_maquina" placeholder=" ">
                <label>Cantidad de máquinas</label>
                <span></span>
            </div>

            <div class="User">
                <input type="text" name="categoria" placeholder=" ">
                <label>Categoría</label>
                <span></span>
            </div>

            <div class="User">
                <input type="text" name="inventario" placeholder=" ">
                <label>Inventario adicional</label>
                <span></span>
            </div>
            <div class="User">
                <input type="number" name="precio" placeholder=" ">
                <label>Precio del producto</label>
                <span></span>
            </div>

            <!-- Botones de navegación entre campos y botón de guardar -->
            <div class="navigation-buttons">
                <a href="{% url 'index' %}" class="btn-volver">← Volver al inicio</a>
                <a href="{% url 'post_register_gym' gimnasio.codigo_gym %}" class="btn-agregar">+ Agregar otro producto</a>
            </div>

            <!-- Botón de guardar abajo -->
            <input type="submit" value="Guardar cambios y ver perfil">
        </form>
    </div>
</body>
</html>
