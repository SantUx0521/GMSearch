{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reenviar Verificación - GMSearch</title>
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), url('/static/core/css/img/fondo2.jpg');
            color: black;
            font-size: 1.2rem;
            background-position: center center;
            background-size: cover;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .container h1 {
            color: indigo;
            margin-bottom: 20px;
        }

        .container p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: indigo;
            box-shadow: 0 0 0 3px rgba(75, 0, 130, 0.1);
        }

        .btn-enviar {
            background: indigo;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .btn-enviar:hover {
            background: purple;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-volver {
            display: inline-block;
            background: transparent;
            color: indigo;
            padding: 10px 20px;
            border: 2px solid indigo;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-volver:hover {
            background: indigo;
            color: white;
        }

        .icon {
            font-size: 48px;
            color: indigo;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <i class="fas fa-envelope"></i>
        </div>
        <h1>Reenviar Verificación</h1>
        <p>Si no recibiste el email de verificación o el enlace expiró, ingresa tu correo electrónico para reenviarlo.</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com">
            </div>
            <button type="submit" class="btn-enviar">Reenviar Verificación</button>
        </form>
        
        <a href="{% url 'login' %}" class="btn-volver">Volver al Login</a>
    </div>
</body>
</html>
