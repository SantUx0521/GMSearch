{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - GMSearch</title>
    <link rel="stylesheet" href="{% static 'core/css/login.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .message {
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="main">
        <a href="{% url 'index' %}" class="home-icon" title="Volver al inicio">
            <i class="fas fa-home"></i>
        </a>
        <div class="center">
            <h1>Recuperar Contraseña</h1>
            
            {% if mensaje %}
                <div class="message {{ tipo }}">
                    {{ mensaje }}
                </div>
            {% endif %}
            
            <form method="POST">
                {% csrf_token %}
                <div class="Username">
                    <input type="email" name="email" id="email" required>
                    <label>Correo electrónico</label>
                    <span></span>
                </div>
                
                <input type="submit" value="Enviar enlace de recuperación">
                
                <div class="back-link">
                    <a href="{% url 'login' %}">
                        <i class="fas fa-arrow-left"></i> Volver al inicio de sesión
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
