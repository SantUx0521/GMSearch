{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>
    <link rel="stylesheet" href="{% static 'core/css/profile.css' %}">
    <style>
        body {
            overflow-y: auto !important;
            height: auto !important;
        }
        
        .card {
            position: relative !important;
            top: 20px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            height: auto !important;
            min-height: 700px;
            max-height: 90vh;
            overflow-y: auto;
            margin-bottom: 40px;
        }
        
        .form-group {
            margin: 20px 0;
            text-align: center;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        
        .form-group input, .form-group select {
            width: 80%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            text-align: center;
            background-color: white;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: indigo;
        }
        
        .photo-upload {
            text-align: center;
            margin: 20px 0;
        }
        
        .current-photo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px;
            display: block;
            border: 3px solid indigo;
        }
        
        .photo-input {
            display: none;
        }
        
        .photo-label {
            background: indigo;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            display: inline-block;
            transition: background-color 0.3s;
        }
        
        .photo-label:hover {
            background: rgb(41, 1, 70);
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .btn-cancel {
            background: #666 !important;
            border-color: #666 !important;
        }
        
        .btn-cancel:hover {
            background: #555 !important;
            border-color: #555 !important;
        }
        
        .card_body {
            padding: 20px 40px !important;
        }
        
        .card_header {
            margin-bottom: 20px;
        }
        
        .profile_pic {
            background-image: url({% static 'core/css/img/male.jpg' %}) !important;
        }
        
        .password-section {
            border-top: 2px solid #e0e0e0;
            margin-top: 30px;
            padding-top: 20px;
            animation: slideDown 0.3s ease-out;
        }
        
        .password-section h3 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        
        .form-group input[type="password"] {
            width: 80%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            text-align: center;
            background-color: white;
        }
        
        .form-group input[type="password"]:focus {
            outline: none;
            border-color: indigo;
        }
        
        .btn-secondary {
            background: #666 !important;
            border-color: #666 !important;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid;
        }
        
        .btn-secondary:hover {
            background: #555 !important;
            border-color: #555 !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <article class="card">
        <h1>Editar Perfil de {{ usuario.nombre }}</h1>
        
        {% if error %}
        <div style="background-color: #ffebee; color: #c62828; padding: 15px; margin: 20px; border-radius: 10px; border: 1px solid #ef5350; text-align: center;">
            <strong>Error:</strong> {{ error }}
        </div>
        {% endif %}
        
        <header class="card_header">
            {% if usuario.foto_perfil %}
                <img id="profile-preview" src="{{ usuario.foto_perfil.url }}" alt="Foto de perfil" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; margin: 0 auto; display: block; box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);">
            {% else %}
                <div id="profile-preview" class="profile_pic"></div>
            {% endif %}
        </header>
        
        <section class="card_body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="photo-upload">
                    <label for="foto_perfil" class="photo-label">
                        Cambiar Foto de Perfil
                    </label>
                    <input type="file" id="foto_perfil" name="foto_perfil" class="photo-input" accept="image/*">
                    <p style="font-size: 12px; color: #666; margin-top: 5px;">
                        Haz clic para seleccionar una nueva imagen
                    </p>
                </div>
                
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" value="{{ usuario.nombre }}" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" value="{{ usuario.email }}" required>
                </div>
                
                <div class="form-group">
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad" value="{{ usuario.edad|default:'' }}" min="1" max="120">
                </div>
                
                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" value="{{ usuario.telefono|default:'' }}">
                </div>
                
                <div class="form-group">
                    <label for="estatura">Estatura (cm):</label>
                    <input type="number" id="estatura" name="estatura" value="{{ usuario.estatura|default:'' }}" step="0.1" min="50" max="300">
                </div>
                
                <div class="form-group">
                    <label for="peso">Peso (kg):</label>
                    <input type="number" id="peso" name="peso" value="{{ usuario.peso|default:'' }}" step="0.1" min="20" max="300">
                </div>
                
                <div class="form-group">
                    <label for="sexo">Sexo:</label>
                    <select id="sexo" name="sexo">
                        <option value="">Seleccionar...</option>
                        <option value="M" {% if usuario.sexo == 'M' %}selected{% endif %}>Masculino</option>
                        <option value="F" {% if usuario.sexo == 'F' %}selected{% endif %}>Femenino</option>
                    </select>
                </div>
                
                <div class="form-group" style="text-align: center; margin: 30px 0;">
                    <button type="button" id="show-password-btn" class="btn-secondary" onclick="togglePasswordSection()">
                         ¿Deseas cambiar tu contraseña?
                    </button>
                </div>
                
                <div class="password-section" id="password-section" style="display: none;">
                    <h3> Cambiar Contraseña</h3>
                    
                    <div class="form-group">
                        <label for="current_password">Contraseña Actual:</label>
                        <input type="password" id="current_password" name="current_password" placeholder="Ingresa tu contraseña actual">
                    </div>
                    
                    <div class="form-group">
                        <label for="new_password">Nueva Contraseña:</label>
                        <input type="password" id="new_password" name="new_password" placeholder="Ingresa tu nueva contraseña">
                    </div>
                    
                    <div class="form-group">
                        <label for="confirm_password">Confirmar Nueva Contraseña:</label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirma tu nueva contraseña">
                    </div>
                </div>
                
                <div class="buttons">
                    <button type="submit">Guardar Cambios</button>
                    <button type="button" class="btn-cancel" onclick="window.location.href='{% url 'profile' %}'">Cancelar</button>
                </div>
            </form>
        </section>
    </article>
    
    <script>

        document.getElementById('foto_perfil').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const previewElement = document.getElementById('profile-preview');
                    if (previewElement.tagName === 'IMG') {
                        previewElement.src = e.target.result;
                    } else {
                        previewElement.style.backgroundImage = `url(${e.target.result})`;
                    }
                };
                reader.readAsDataURL(file);
            }
        });
        
        // Validación de contraseñas en tiempo real
        const newPassword = document.getElementById('new_password');
        const confirmPassword = document.getElementById('confirm_password');
        
        function validatePasswords() {
            const newPass = newPassword.value;
            const confirmPass = confirmPassword.value;
            
            // Remover clases de validación anteriores
            newPassword.classList.remove('valid', 'invalid');
            confirmPassword.classList.remove('valid', 'invalid');
            
            if (newPass.length > 0) {
                if (newPass.length >= 8) {
                    newPassword.classList.add('valid');
                    newPassword.style.borderColor = '#4caf50';
                } else {
                    newPassword.classList.add('invalid');
                    newPassword.style.borderColor = '#f44336';
                }
            }
            
            if (confirmPass.length > 0 && newPass.length > 0) {
                if (newPass === confirmPass) {
                    confirmPassword.classList.add('valid');
                    confirmPassword.style.borderColor = '#4caf50';
                } else {
                    confirmPassword.classList.add('invalid');
                    confirmPassword.style.borderColor = '#f44336';
                }
            }
        }
        
        newPassword.addEventListener('input', validatePasswords);
        confirmPassword.addEventListener('input', validatePasswords);
        
        // Función para mostrar/ocultar la sección de contraseña
        function togglePasswordSection() {
            const passwordSection = document.getElementById('password-section');
            const showPasswordBtn = document.getElementById('show-password-btn');
            
            if (passwordSection.style.display === 'none') {
                passwordSection.style.display = 'block';
                showPasswordBtn.innerHTML = ' Ocultar cambio de contraseña';
                showPasswordBtn.style.background = '#f44336 !important';
                showPasswordBtn.style.borderColor = '#f44336 !important';
            } else {
                passwordSection.style.display = 'none';
                showPasswordBtn.innerHTML = ' ¿Deseas cambiar tu contraseña?';
                showPasswordBtn.style.background = '#666 !important';
                showPasswordBtn.style.borderColor = '#666 !important';
                
                // Limpiar los campos de contraseña
                document.getElementById('current_password').value = '';
                document.getElementById('new_password').value = '';
                document.getElementById('confirm_password').value = '';
                
                // Limpiar validaciones visuales
                document.getElementById('new_password').style.borderColor = '#ddd';
                document.getElementById('confirm_password').style.borderColor = '#ddd';
            }
        }
    </script>
</body>
</html>
